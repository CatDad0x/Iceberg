<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <linearGradient id="iceFill" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8eef8"/>
    </linearGradient>
    <linearGradient id="subFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9dd0ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c5e6f8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- ── Below-water dashed triangle ─────────────────────────── -->
  <polygon
    points="44,278  356,278  200,404"
    fill="url(#subFill)"
    stroke="#4a9fd4"
    stroke-width="2"
    stroke-dasharray="9,6"
    stroke-linejoin="round"
  />

  <!-- ── Waterline ─────────────────────────────────────────────── -->
  <line x1="20" y1="278" x2="380" y2="278" stroke="#4a9fd4" stroke-width="1.8"/>
  <!-- Wave marks -->
  <path d="M 26,272 Q 34,266 42,272 Q 50,278 58,272"
    stroke="#4a9fd4" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 338,272 Q 346,266 354,272 Q 362,278 370,272"
    stroke="#4a9fd4" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- ── Above-water iceberg silhouette ────────────────────────── -->
  <!--
    Clean 3-peak mountain shape. Vertices in clockwise order.
    Waterline = y 278. No backtracking in y within each slope.

    Left base  → up left slope
               → LEFT MINOR PEAK (C)
               → valley dip (D)
               → up steeply → MAIN PEAK (E)
               → down to valley (F,G)
               → up to RIGHT PEAK (H)
               → down right slope
               → right base
  -->
  <path d="
    M  84,278
    L 112,222
    L 140,188
    L 158,205
    L 180, 64
    L 205,115
    L 224,130
    L 248, 92
    L 272,148
    L 296,202
    L 318,250
    L 326,278
    Z
  "
    fill="url(#iceFill)"
    stroke="#1c3668"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- ── Interior facet lines ───────────────────────────────────── -->
  <!-- From MAIN PEAK down-left toward left base -->
  <line x1="180" y1=" 64" x2="128" y2="278"
    stroke="#1c3668" stroke-width="1.4" stroke-opacity="0.6"/>
  <!-- From MAIN PEAK down toward centre-right base -->
  <line x1="180" y1=" 64" x2="200" y2="278"
    stroke="#1c3668" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- From LEFT MINOR PEAK down to base -->
  <line x1="140" y1="188" x2="108" y2="278"
    stroke="#1c3668" stroke-width="1.1" stroke-opacity="0.45"/>
  <!-- From RIGHT PEAK down toward right-centre base -->
  <line x1="248" y1=" 92" x2="254" y2="278"
    stroke="#1c3668" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Valley between main and right peak — short inner facet -->
  <line x1="224" y1="130" x2="230" y2="278"
    stroke="#1c3668" stroke-width="1.0" stroke-opacity="0.35"/>

</svg>
